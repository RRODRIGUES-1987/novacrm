<script>
// ───────── armazenamento (navegador por enquanto; mesmas chaves da ficha de venda, para conversarem na versão local) ─────────
const $=id=>document.getElementById(id);
const ls={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } } };

  const dentro=f.com.on&&f.com.forma==='nf', fora=f.com.on&&f.com.forma==='direto';
  const nf=Math.max(0,pedido-(fora?comV:0)), totComprador=pedido+(frFora?frete:0), empresa=nf-(dentro?comV:0)-(frDentro?frete:0);

function cliInfo(c){ return c&&c.id?`${esc(c.documento||'sem CPF/CNPJ')} · ${esc(c.telefone||'sem telefone')}${c.email?' · '+esc(c.email):''}<br>${esc(c.endereco||'endereço não informado')}${c.cidade_uf?' · '+esc(c.cidade_uf):''}`:'Escolha o cliente do cadastro (ou crie um novo).'; }

function lerFV(){ const f=FV; if(!f||!$('fv_cli')) return; const vAnt=f.vendedor_id;

  f.prazo=$('fv_prazo').value; f.garantia=$('fv_gar').value; f.instr=$('fv_instr').value; f.obs=$('fv_obs').value;

  if($('fv_frv')){ f.fre.val=num($('fv_frv').value); $('fvFrInfo').innerHTML=pixInfo(pessoa('transportadores',f.fre.id)); }

  f.sujo=true; $('fvSujo').textContent='· alterações não salvas'; calcFV(); }
function segFV(g,v){ const f=FV; lerFV();

  if(g==='ent'){ f.fre.tipo=v; f.fre.on=v==='frete'; if(v!=='retira'&&!f.fre.end){ const c=pessoa('clientes',f.cliente_id); f.fre.end=[c.endereco,c.cidade_uf].filter(Boolean).join(' · '); } }

function calcFV(){ const f=FV; if(!f||!$('fvTot')) return; const t=totFV(f), par=parcelado(f.pag);
  document.querySelectorAll('.fv-par').forEach(e=>e.style.display=par?'':'none');

  const L=[...cs.map(c=>[c.nome,c.preco])]; if(t.op) L.push(['Opcionais',t.op*t.qtd]); if(t.desc) L.push(['Desconto'+(f.descTipo==='pct'?' '+String(f.descVal).replace('.',',')+'%':''),-t.desc]);

  $('fvLin').innerHTML=L.map(x=>`<div class="${x[2]?'nf':''}${x[1]<0?' menos':''}"><span>${esc(x[0])}</span><span>${brl(x[1])}</span></div>`).join('');
  $('fvLiq').textContent=brl(t.empresa);
  const tr=pessoa('transportadores',f.fre.id);
  const emp=avista(f.pag)&&(+f.entrada>0||f.saldoEnt)?`${+f.entrada>0?`<div><span>Entrada${f.entData?' · '+dBR(f.entData).slice(0,5):''}${f.entRec?' <span class="tag t-disp">recebida</span>':''}</span><span>${brl(f.entrada)}</span></div>`:''}<div><span>${f.saldoEnt?'Falta na entrega (PIX)':'Saldo'+(f.venc1?' · '+dBR(f.venc1).slice(0,5):'')}</span><b>${brl(saldo)}</b></div>`:`<div><span>À empresa (NF)</span><b>${brl(t.nf)}</b></div>`;
  $('fvQuem').innerHTML=`<small>Como o comprador paga</small>${emp}${t.fora&&t.comV?`<div><span>Ao comissionado</span><span>${brl(t.comV)}</span></div>`:''}${t.frFora&&t.frete?`<div><span>Ao transportador</span><span>${brl(t.frete)}</span></div>`:''}`;

async function gravarFV(){ const f=FV; lerFV();

  if(!f.id){ f.numero=await q(sb.rpc('proximo_numero',{p_empresa:EMP_ID,p_chave:'FV'})); const r=await ins('vendas',Object.assign(linhaVenda(f),{criado_por:USR.id})); f.id=r[0].id; }

  const antes=C.veiculos.filter(v=>v.venda_id===f.id).map(v=>v.id);

    await q(sb.from('veiculo_eventos').insert(entra.map(id=>({empresa_id:EMP_ID,veiculo_id:id,evento:'Reservado na ficha de venda',detalhe:pessoa('clientes',f.cliente_id).nome||'',referencia:f.numero,feito_por:USR.id})))); }
  await q(sb.from('venda_itens').delete().eq('venda_id',f.id));

  return `<h1>Entregas</h1><p class="sub">Solicitações geradas pelas fichas de venda · ${n('programada')+n('reprogramada')} a fazer · ${n('entregue')} entregue(s). Agenda, checklist de entrega técnica, foto e termo entram na próxima etapa.</p>
  <div class="card"><div class="filtros"><input placeholder="Buscar por ficha, cliente ou local" value="${esc(filtroEnt.q)}" oninput="filtroEnt.q=this.value;$('entTab').innerHTML=tabEnt()">
  <select onchange="filtroEnt.st=this.value;$('entTab').innerHTML=tabEnt()"><option value="ativas" ${filtroEnt.st==='ativas'?'selected':''}>A fazer</option><option value="" ${!filtroEnt.st?'selected':''}>Todas</option>${Object.keys(ST_ENT).map(k=>`<option value="${k}" ${filtroEnt.st===k?'selected':''}>${ST_ENT[k][0]}</option>`).join('')}</select></div><div id="entTab">${tabEnt()}</div></div>`; }
function tabEnt(){ const q=filtroEnt.q.toUpperCase();
  const R=C.entregas.map(e=>{ const v=C.vendas.find(x=>x.id===e.venda_id)||{}, c=pessoa('clientes',v.cliente_id), t=pessoa('transportadores',e.transportador_id);
      const ch=C.venda_veiculos.filter(x=>x.venda_id===v.id).map(x=>(C.veiculos.find(y=>y.id===x.veiculo_id)||{}).chassi).filter(Boolean);
      return {e,v,cli:c.nome||'—',quem:t.nome||(e.tipo==='cortesia'?'Equipe própria':'—'),ch}; })
    .filter(r=>(filtroEnt.st==='ativas'?['programada','reprogramada','em_rota'].includes(r.e.status):(!filtroEnt.st||r.e.status===filtroEnt.st))&&(!q||(r.v.numero+' '+r.cli+' '+(r.e.endereco||'')).toUpperCase().includes(q)))
    .sort((a,b)=>String(a.e.data_prevista||'9999').localeCompare(String(b.e.data_prevista||'9999')));
  return R.length?`<table class="t"><tr><th>Data</th><th>Horário</th><th>Ficha</th><th>Cliente</th><th>Chassis</th><th>Local</th><th>Quem entrega</th><th>Tipo</th><th class="r">Receber na entrega</th><th>Situação</th></tr>${R.map(r=>`<tr class="click" onclick="irFicha('${r.v.id}')"><td><b>${r.e.data_prevista?dBR(r.e.data_prevista):'a definir'}</b></td><td>${esc(r.e.janela||'—')}</td><td>${esc(r.v.numero||'—')}</td><td>${esc(r.cli)}</td><td>${esc(r.ch.join(', ')||'—')}</td><td>${esc(r.e.endereco||'—')}</td><td>${esc(r.quem)}</td><td>${r.e.tipo==='cortesia'?'sem cobrança':'frete'}</td><td class="r">${r.v.saldo_na_entrega?'<b>'+brl(Math.max(0,(+r.v.valor_nf||0)-(+r.v.entrada||0)))+'</b> PIX':'—'}</td><td><span class="tag ${(ST_ENT[r.e.status]||ST_ENT.programada)[1]}">${(ST_ENT[r.e.status]||ST_ENT.programada)[0]}</span></td></tr>`).join('')}</table>`
    :'<div class="vazio">Nenhuma entrega com esses filtros. As solicitações aparecem aqui quando uma ficha de venda é salva com entrega.</div>'; }
function irFicha(id){ mod='com'; tela='fichas'; abrirFV(id); }
const TELAS={ home:telaHome, fichas:telaFichas, entregas:telaEntregas, itens:()=>telaCad('itens'), modelos:telaModelos, clientes:()=>telaCad('clientes'), fornecedores:()=>telaCad('fornecedores'), transportadores:()=>telaCad('transportadores'), vendedores:()=>telaCad('vendedores'), locais:telaLocais, empresa:telaEmpresa,
  estoque:telaEstoque, recebimento:telaRecebimento, movimentos:telaMovimentos };
iniciar();
</script>
